id: pr_review_v1
version: "1.0.0"
description: "Top-level prompt to instruct the LLM how to review a PR diff"
variables:
  - name: pr_title
    type: str
  - name: changed_files
    type: str
  - name: diff_snippet
    type: str
  - name: language
    type: str
template: |
  You are a senior code reviewer. For the following diff snippet from pull request titled: "{pr_title}",
  analyze the changes and produce JSON array of comments where each item:
  - file: path/to/file
  - line_start: int
  - line_end: int
  - severity: [LOW, MEDIUM, HIGH]
  - category: [BUG, SECURITY, PERFORMANCE, STYLE, DOCUMENTATION]
  - message: string (actionable recommendation)
  - suggestion_patch: optional code snippet or one-line fix

  Changed files: {changed_files}
  Diff:
  {diff_snippet}

  Provide explanation in <= 3 sentences per comment. Output must be valid JSON array.
