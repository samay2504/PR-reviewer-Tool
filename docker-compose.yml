version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: pr-agent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: pr-agent-app
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=true
      - LOG_LEVEL=INFO
    env_file:
      - .env
    volumes:
      - ./templates:/app/templates
      - ./logs:/app/logs
      - cache-data:/app/.cache
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
  cache-data:
